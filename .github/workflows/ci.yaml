name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cruskell/dynamite-compiler-dev:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests with native preprocessing
        run: DYNAMITE_PREPROCESSOR=native cargo test --verbose

  build-without-llvm-sdk:
    runs-on: ubuntu-latest
    container:
      image: rust:1.86.0-slim
    steps:
      - uses: actions/checkout@v7
      - name: Build all targets without Clang or an LLVM SDK
        run: cargo build --all-targets --all-features --verbose
      - name: Generate LLVM IR without Clang or an LLVM SDK
        run: |
          printf '#include <stddef.h>\n#define VALUE 42\nint main(void) { return VALUE + sizeof(char) - 1; }\n' > /tmp/sdk-free.c
          DYNAMITE_PREPROCESSOR=native target/debug/dynamite_compiler -o llvm /tmp/sdk-free.c > /tmp/sdk-free.ll
          grep -q '@main(' /tmp/sdk-free.ll
      - name: Install external LLVM tools without Clang
        run: apt-get update && apt-get install -y llvm-15 lld-15
      - name: Test the LLVM tools backend without Clang
        env:
          DYNAMITE_LLC: llc-15
          DYNAMITE_OPT: opt-15
          DYNAMITE_LLD: ld.lld-15
        run: cargo test llvm_tools_backend -- --ignored
