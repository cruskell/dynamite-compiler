name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    container:
      image: rust:1.86.0-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust lint components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build all targets without Clang or an LLVM SDK
        run: cargo build --all-targets --all-features --verbose
      - name: Generate LLVM IR without Clang or an LLVM SDK
        run: |
          printf '#include <stddef.h>\n#define VALUE 42\nint main(void) { return VALUE + sizeof(char) - 1; }\n' > /tmp/sdk-free.c
          target/debug/dynamite_compiler -o llvm /tmp/sdk-free.c > /tmp/sdk-free.ll
          grep -q '@main(' /tmp/sdk-free.ll
      - name: Install external LLVM tools without Clang
        run: apt-get update && apt-get install -y llvm-15 lld-15
      - name: Test the LLVM tools backend without Clang
        env:
          DYNAMITE_LLC: llc-15
          DYNAMITE_OPT: opt-15
          DYNAMITE_LLD: ld.lld-15
        run: cargo test llvm_tools_backend -- --ignored
      - name: Install Clang for assembly and IR execution tests
        run: apt-get install -y --no-install-recommends clang-15 make
      - name: Run all tests with native preprocessing
        run: PATH="/usr/lib/llvm-15/bin:$PATH" cargo test --verbose

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: rust:1.86.0-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install native compiler and lint components
        run: |
          test "$(uname -m)" = aarch64
          apt-get update && apt-get install -y --no-install-recommends clang-15 make
          rustup component add rustfmt clippy
      - name: Check formatting and architecture-specific lints
        run: make lint
      - name: Run native ARM64 assembly and LLVM tests
        run: PATH="/usr/lib/llvm-15/bin:$PATH" cargo test --all-features --verbose

  build-macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            name: build-macos-x86_64
            machine: x86_64
          - runner: macos-15
            name: build-macos-arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.86.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust lint components
        run: rustup toolchain install 1.86.0 --profile minimal --component rustfmt --component clippy
      - name: Verify native architecture and compiler
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustc -vV
          clang --version
      - name: Check formatting and architecture-specific lints
        run: make lint
      - name: Run native macOS assembly and LLVM tests
        run: cargo test --all-features --verbose
