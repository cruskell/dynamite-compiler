name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cruskell/dynamite-compiler-dev:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  build-ubuntu-in-process:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cruskell/dynamite-compiler-dev:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Clang 15 SDK
        run: apt-get update && apt-get install -y llvm-15-dev libclang-15-dev libclang-cpp15-dev g++
      - name: Build with in-process Clang
        run: cargo build --features clang-in-process --verbose
      - name: Run tests with in-process Clang
        run: cargo test --features clang-in-process --verbose
