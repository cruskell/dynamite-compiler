name: publish

on:
  push:
    branches: ["main"]
    paths:
      - dockerfiles/dev.Dockerfile
      - .dockerignore
      - .github/workflows/publish.yaml
  pull_request:
    branches: ["main"]
    paths:
      - dockerfiles/dev.Dockerfile
      - .dockerignore
      - .github/workflows/publish.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/dev.Dockerfile
          load: true
          push: false
          tags: dynamite-compiler-dev:test
          platforms: linux/amd64
          cache-from: type=gha,scope=dev-image-amd64
          cache-to: type=gha,mode=max,scope=dev-image-amd64
      - name: Test in the new image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            dynamite-compiler-dev:test cargo test --verbose
  docker-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: cruskell
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/dev.Dockerfile
          push: true
          load: false
          tags: ghcr.io/cruskell/dynamite-compiler-dev:latest,ghcr.io/cruskell/dynamite-compiler-dev:develop,ghcr.io/cruskell/dynamite-compiler-dev:0.0.3
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          cache-from: |
            type=gha,scope=dev-image
            type=gha,scope=dev-image-amd64
          cache-to: type=gha,mode=max,scope=dev-image
